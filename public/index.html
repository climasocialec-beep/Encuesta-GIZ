<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D9488" />
    <meta name="description" content="Centro de Gestión y Monitoreo de Campo · Clima Social en cooperación con la GIZ" />
    <title>Centro de Gestión · Clima Social GIZ</title>
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <div id="login-screen"></div>
    <div class="app-shell" id="app-shell" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-logos-wrap">
            <img class="brand-logo-cs" src="/logo-clima-social.png" alt="Clima Social" onerror="this.src='/logo-icon.svg'" />
            <span class="brand-divider"></span>
            <img class="brand-logo-giz" src="/logo-giz.png" alt="GIZ" onerror="this.style.display='none'" />
          </div>
          <div class="brand-info">
            <strong>Centro de Gestión</strong>
            <span>Clima Social · GIZ</span>
          </div>
        </div>

        <div class="workspace-label">ESPACIO DE TRABAJO</div>
        <nav class="main-nav" aria-label="Navegación principal">
          <button class="nav-item active" data-view="dashboard">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
            </span>
            <span>Resumen</span>
            <span class="nav-arrow">›</span>
          </button>
          <button class="nav-item" data-view="operator">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </span>
            <span>Mi jornada</span>
            <span class="nav-badge">12</span>
          </button>
          <button class="nav-item" data-view="contacts">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </span>
            <span>Contactos</span>
          </button>
          <button class="nav-item" data-view="history">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            </span>
            <span>Historial</span>
          </button>
          <button class="nav-item" data-view="import">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
            </span>
            <span>Importar base</span>
          </button>
        </nav>

        <div class="sidebar-campaign">
          <div class="campaign-label">
            <span class="live-dot"></span> CAMPAÑA ACTIVA
          </div>
          <strong>Clima Social · GIZ</strong>
          <span>Base de campo · Cooperación GIZ</span>
          <div class="mini-progress"><span style="width: 59.5%"></span></div>
          <div class="campaign-meta"><span>0% avance</span><span>0 registros</span></div>
        </div>

        <div class="sidebar-footer">
          <div class="user-card">
            <div class="avatar avatar-emerald">CS</div>
            <div class="user-details">
              <strong>Clima Social</strong>
              <span>Supervisor</span>
            </div>
            <button class="more-button" aria-label="Más opciones">•••</button>
          </div>
          <div class="secure-note">
            <span class="secure-icon">🛡️</span> Datos protegidos y auditados
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <button class="mobile-menu" id="mobile-menu" aria-label="Abrir menú">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>
            <div class="crumb">
              <span class="crumb-root">Campañas</span>
              <b class="crumb-sep">/</b>
              <strong class="crumb-active">Clima Social GIZ</strong>
            </div>
          </div>
          <div class="topbar-actions">
            <div class="cobrand-badge-top">
              <span class="badge-tag">Alianza</span>
              <strong>Clima Social</strong>
              <span class="giz-mini-tag">giz</span>
            </div>
            <div class="sync-status"><span class="live-dot"></span> Modo demo local</div>
            <button class="icon-button" title="Notificaciones" aria-label="Notificaciones">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
              <i></i>
            </button>
            <div class="topbar-user">
              <span class="top-user-name" id="top-user-name"></span>
              <div class="top-avatar">AS</div>
            </div>
            <button class="logout-top" id="logout-top" type="button">
              <span>Salir</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            </button>
          </div>
        </header>
        <div class="franja-textil" aria-hidden="true"></div>

        <div id="app-content"></div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=17"></script>
  </body>
</html>
